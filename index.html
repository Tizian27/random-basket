<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Random Basket</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="assets/BasketballEmoji.ico" type="image/x-icon" />
  </head>

  <body>
    <main>
      <h1>🏀 Random Basket 🏀</h1>
      <h3 class="subtitle">definitely not a rip-off</h3>
      <h4 class="subtitle">and no, basketball emojis do not mean that this is AI-Slop :/</h3>

      <div id="game-container">
        <canvas id="game" width="800" height="600"></canvas>
      </div>

      <div id="ui">
        <span>Score: <strong id="score">0</strong></span>
        <span>Leben: <strong id="lives">3</strong></span>
      </div>

      <button id="start-button">Spiel starten</button>
      <div id="debuggingText"></div>
    </main>

    <script type="module" src="game.js"></script>
  </body>
</html>
